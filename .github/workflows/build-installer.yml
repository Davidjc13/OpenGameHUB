name: Build and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'alpha-*'
      - 'beta-*'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore OpenGameHUB.sln

      - name: Lint (format)
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          dotnet format OpenGameHUB.sln --verify-no-changes --verbosity minimal

      - name: Build
        shell: pwsh
        run: dotnet build OpenGameHUB.sln -c Release --no-restore

      - name: Test with coverage
        shell: pwsh
        run: |
          dotnet test OpenGameHUB.sln -c Release --no-build `
            --settings coverlet.runsettings `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage/raw `
            --verbosity normal

      - name: Coverage report
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          $reports = @(
            Get-ChildItem -Path ./coverage/raw -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue
            Get-ChildItem -Path ./tests/OpenGameHUB.Tests/TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue
          ) | Sort-Object LastWriteTime -Descending
          if ($reports.Count -eq 0) { throw "No coverage files found." }
          reportgenerator `
            -reports:$reports[0].FullName `
            -targetdir:./coverage/report `
            -reporttypes:"TextSummary;HtmlInline_AzurePipelines;Cobertura"
          Get-Content ./coverage/report/Summary.txt

      - name: Prepare PR coverage comment
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $summary = (Get-Content ./coverage/report/Summary.txt -Raw).TrimEnd()
          $nl = [Environment]::NewLine
          $body = @(
            '## Test coverage',
            '',
            'Scope: types listed in `coverlet.runsettings` (minimum **70%** line coverage).',
            '',
            'Download the full HTML report from the **coverage-report** workflow artifact.',
            '',
            '<details>',
            '<summary>Summary.txt</summary>',
            '',
            '```text',
            $summary,
            '```',
            '',
            '</details>'
          ) -join $nl
          Set-Content -Path ./coverage/report/pr-comment.md -Value $body -Encoding utf8

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/report/pr-comment.md
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report/
          if-no-files-found: error

  publish:
    name: Publish
    needs: ci
    if: github.ref_type == 'tag'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        env:
          GITHUB_REF_NAME_INPUT: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME_INPUT
          $valid = $version -match '^(alpha-|beta-)' -or $version -match '^\d+\.\d+\.\d+$'
          if (-not $valid) {
            Write-Error "Tag '$version' does not match alpha-*, beta-*, or xx.yy.zz"
          }
          Write-Host "Publishing version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          $prerelease = $version -match '^(alpha-|beta-)'
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Detect code signing
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
        shell: pwsh
        run: |
          $azure = -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_TRUSTED_SIGNING_ACCOUNT) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_TRUSTED_SIGNING_ENDPOINT) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_TRUSTED_SIGNING_PROFILE)
          $pfx = -not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_BASE64)
          "azure=$azure" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          if ($azure) {
            Write-Host "Code signing: Azure Trusted Signing"
          } elseif ($pfx) {
            Write-Host "Code signing: Authenticode PFX"
          } else {
            Write-Host "Code signing: not configured; installer will be unsigned"
          }

      - name: Publish application
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: .\build-installer.ps1 -AppVersion $env:APP_VERSION -SkipWingetInstall -SkipSign -Stage Publish

      - name: Azure login
        if: steps.signing.outputs.azure == 'True'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign OpenGameHUB.exe (Azure Trusted Signing)
        if: steps.signing.outputs.azure == 'True'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\win-x64-release\OpenGameHUB.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign OpenGameHUB.exe (PFX)
        if: steps.signing.outputs.azure != 'True' && steps.signing.outputs.pfx == 'True'
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        shell: pwsh
        run: .\scripts\sign-authenticode.ps1 -Required -Files "$pwd\publish\win-x64-release\OpenGameHUB.exe"

      - name: Build installer
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: .\build-installer.ps1 -AppVersion $env:APP_VERSION -SkipWingetInstall -SkipSign -Stage Inno

      - name: Sign installer (Azure Trusted Signing)
        if: steps.signing.outputs.azure == 'True'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign installer (PFX)
        if: steps.signing.outputs.azure != 'True' && steps.signing.outputs.pfx == 'True'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $setup = Join-Path $pwd "dist\OpenGameHUB-Setup-$env:APP_VERSION.exe"
          .\scripts\sign-authenticode.ps1 -Required -Files $setup

      - name: Write installer checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: .\build-installer.ps1 -AppVersion $env:APP_VERSION -SkipWingetInstall -SkipSign -Stage Checksum

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGameHUB-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/OpenGameHUB-Setup-*.exe
            dist/OpenGameHUB-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenGameHUB-Setup-*.exe
            dist/OpenGameHUB-Setup-*.exe.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.prerelease == 'True' }}
